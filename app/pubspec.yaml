name: piolinpos
description: "PiolinPOS — Punto de venta móvil para El Piolín (taquería y abarrotes)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  google_fonts: ^6.2.1

  # Persistencia local
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # Respaldo en Google Drive
  google_sign_in: ^6.2.2
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Reportes y escáner
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.4
  mobile_scanner: ^6.0.2
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
